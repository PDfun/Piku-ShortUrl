[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# API routes
[[redirects]]
  from = "/api/shorten"
  to = "/.netlify/functions/shorten"
  status = 200

[[redirects]]
  from = "/api/info/*"
  to = "/.netlify/functions/info/:splat"
  status = 200

# Anything else that isn't a real file is treated as a short code
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/redirect"
  status = 200
